name: "CD - Deploy Application"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to deploy"
        required: false
        default: "main"
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: "main"

jobs:
  infra:
    name: Apply infrastructure
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Deploy application code
    needs: infra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || 'main' }}

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # Adjust this path if your PHP app files live in a subfolder of the
      # repo rather than at the root.
      - name: Zip application code
        run: |
          zip -r /tmp/library-booking-app.zip . \
            -x ".git/*" ".github/*" "infra/*" "uploads/*" "*.md"

      - name: Get S3 bucket name from Terraform output
        id: tf-output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3
        run: |
          aws s3 cp /tmp/library-booking-app.zip \
            "s3://${{ steps.tf-output.outputs.bucket }}/artifacts/library-booking-app.zip"

      # terraform apply above returns as soon as the AWS API calls succeed -
      # not once new/replaced EC2 instances have finished booting and
      # registered with SSM. Poll until at least one is ready before sending
      # the deploy command, otherwise send-command finds zero targets.
      - name: Wait for an SSM-managed running instance
        run: |
          for i in $(seq 1 30); do
            COUNT=$(aws ssm describe-instance-information \
              --filters "Key=tag:App,Values=assignment-library-booking" \
              --query "length(InstanceInformationList[?PingStatus=='Online'])" \
              --output text)
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT online instance(s)."
              exit 0
            fi
            echo "No online instances yet, waiting 10s ($i/30)..."
            sleep 10
          done
          echo "Timed out waiting for an SSM-managed instance." >&2
          exit 1

      - name: Deploy via SSM Run Command
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=assignment-library-booking" \
            --comment "Deploy library-resource-scheduling app" \
            --parameters commands='[
              "aws s3 cp s3://'"${{ steps.tf-output.outputs.bucket }}"'/artifacts/library-booking-app.zip /tmp/app.zip --region us-east-1",
              "sudo rm -rf /var/www/html/*",
              "sudo unzip -o /tmp/app.zip -d /var/www/html",
              "sudo chown -R apache:apache /var/www/html",
              "sudo systemctl restart httpd"
            ]' \
            --output text
