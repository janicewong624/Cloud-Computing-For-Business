name: "CD - Deploy Application"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to deploy"
        required: false
        default: "main"
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: "main"

jobs:
  infra:
    name: Apply infrastructure
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Deploy application code
    needs: infra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || 'main' }}

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # App files live in the library-resource-scheduling/ subfolder, not at
      # repo root - cd into it so the zip's internal paths are flat
      # (config.php at the zip root, not nested under a subfolder), matching
      # what Apache expects at /var/www/html.
      - name: Zip application code
        run: |
          cd library-resource-scheduling
          zip -r /tmp/library-booking-app.zip . -x "*.md"

      - name: Get S3 bucket + ASG name from Terraform output
        id: tf-output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "asg_name=$(terraform output -raw asg_name)" >> "$GITHUB_OUTPUT"

      - name: Upload app artifact + schema.sql to S3
        run: |
          aws s3 cp /tmp/library-booking-app.zip \
            "s3://${{ steps.tf-output.outputs.bucket }}/artifacts/library-booking-app.zip"
          aws s3 cp library-resource-scheduling/schema.sql \
            "s3://${{ steps.tf-output.outputs.bucket }}/db-init/schema.sql"

      # No SSM needed anywhere in this deploy. Every instance's user-data
      # already knows how to pull the latest app artifact + seed the DB from
      # S3 on boot (see infra/modules/asg/templates/user_data.sh.tftpl) - so
      # to ship a new deploy we just need every instance to reboot fresh from
      # the launch template. Instance Refresh is a plain AWS Auto Scaling
      # API call, unrelated to SSM, so this works even on accounts where SSM
      # registration is blocked.
      - name: Trigger ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.tf-output.outputs.asg_name }}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'

      # Instance Refresh runs in the background and can take several minutes
      # (old instances drain + terminate, new ones boot + pass health
      # checks). Poll until it reports Successful so the workflow only shows
      # green once the new code is actually live, not just "requested".
      - name: Wait for instance refresh to finish
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ steps.tf-output.outputs.asg_name }}" \
              --max-records 1 \
              --query "InstanceRefreshes[0].Status" --output text)
            echo "Instance refresh status: $STATUS ($i/40)"
            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh ended with status $STATUS" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for instance refresh." >&2
          exit 1
