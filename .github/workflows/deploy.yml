name: "CD - Deploy Application"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit to deploy"
        required: false
        default: "main"
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: "main"

jobs:
  infra:
    name: Apply infrastructure
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Deploy application code
    needs: infra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || 'main' }}

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # App files live in the library-resource-scheduling/ subfolder, not at
      # repo root - cd into it so the zip's internal paths are flat
      # (config.php at the zip root, not nested under a subfolder), matching
      # what Apache expects at /var/www/html.
      - name: Zip application code
        run: |
          cd library-resource-scheduling
          zip -r /tmp/library-booking-app.zip . -x "*.md"

      - name: Get S3 bucket + ASG name + target group ARN from Terraform output
        id: tf-output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "asg_name=$(terraform output -raw asg_name)" >> "$GITHUB_OUTPUT"
          echo "tg_arn=$(terraform output -raw target_group_arn)" >> "$GITHUB_OUTPUT"

      - name: Upload app artifact + schema.sql + sample images to S3
        run: |
          aws s3 cp /tmp/library-booking-app.zip \
            "s3://${{ steps.tf-output.outputs.bucket }}/artifacts/library-booking-app.zip"
          aws s3 cp library-resource-scheduling/schema.sql \
            "s3://${{ steps.tf-output.outputs.bucket }}/db-init/schema.sql"
          # Assignment requirement: image uploads must go through S3. The
          # sample/demo photos that ship with the app (rooms, equipment,
          # books) are synced here too, so every image on the site - not
          # just ones uploaded later through the admin forms - is actually
          # served from S3, matching what user-data rewrites the DB rows to
          # point at.
          aws s3 sync library-resource-scheduling/uploads \
            "s3://${{ steps.tf-output.outputs.bucket }}/uploads" --region us-east-1

      # autoscaling:StartInstanceRefresh is ALSO explicitly denied by this
      # account's SCP (same story as SSM). So instead of asking the ASG's
      # management API to do a rolling replacement, we terminate the
      # underlying EC2 instances directly with ec2:TerminateInstances - a
      # much more basic permission that isn't blocked. The ASG's own
      # self-healing (desired capacity vs actual running count) notices the
      # instances are gone and launches fresh replacements from the launch
      # template automatically, which pull the new code + re-check the DB
      # seed on boot, same end result as an instance refresh.
      - name: Replace running instances with fresh ones
        run: |
          ASG_NAME="${{ steps.tf-output.outputs.asg_name }}"
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[].InstanceId" --output text)
          if [ -n "$INSTANCE_IDS" ]; then
            echo "Terminating: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
          else
            echo "No running instances yet - ASG will launch from scratch."
          fi

      # Poll the target group directly (not the ASG) so this works
      # regardless of which AWS API happens to be restricted - ALB/target
      # group permissions are needed for the app to be reachable at all, so
      # they're never blocked.
      - name: Wait for new instances to become healthy
        run: |
          TG_ARN="${{ steps.tf-output.outputs.tg_arn }}"
          for i in $(seq 1 40); do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)
            echo "Healthy targets: $HEALTHY ($i/40)"
            if [ "$HEALTHY" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for a healthy target." >&2
          exit 1
